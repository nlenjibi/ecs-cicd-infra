# CloudFormation GitSync root deployment file.
#
# Uses a single master nested stack to deploy all 9 stacks with ONE
# GitSync link per environment instead of 9.
#
# Pre-requisite: upload all templates to S3 first, then set TemplateBaseUrl.
#   aws s3 sync templates/ s3://YOUR-BUCKET/ecs-cicd-infra/templates/
#
# GitSync setup (AWS Console → CloudFormation → one stack per environment):
#   deployments/dev/master.yaml  → stack: dev-bem13-master
#   deployments/test/master.yaml → stack: test-bem13-master
#   deployments/prod/master.yaml → stack: prod-bem13-master

template-file-path: templates/master.yaml
stack-name: dev-bem13-master
region: us-east-1
capabilities:
  - CAPABILITY_IAM
  - CAPABILITY_NAMED_IAM
parameters:
  Environment: dev
  ProjectName: bem13
  TemplateBaseUrl: https://YOUR-BUCKET.s3.amazonaws.com/ecs-cicd-infra/templates
  AppPort: 8080
  TestListenerPort: 9090
  DesiredCount: 1
  MinCapacity: 1
  MaxCapacity: 4
  CpuScaleOutThreshold: 70
  TaskCpu: 512
  TaskMemory: 1024
  BlueTerminationWaitMinutes: 5

tags:
  Environment: dev
  Project: bem13-ecs-cicd
  ManagedBy: CloudFormation-GitSync
